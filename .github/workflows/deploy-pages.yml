name: Deploy to GitHub Pages

# 当前线上走 gh-pages 分支（Deploy from a branch），本工作流仅保留为
# 切换到「GitHub Actions」发布方式后的手动方案。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送取消旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        # .npmrc 默认指向国内镜像；GitHub 境外 runner 改用官方源更快更稳
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行时自动为仓库启用 Pages（Source: GitHub Actions），无需手动设置
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
