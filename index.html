    <!-- 赛期创作：仅通过链接分享，不进入搜索引擎索引（不影响任何直接访问） -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1a2742" />
    <!-- 首帧深色底：开篇遮罩接管前不闪白（Tailwind 的 body 白底会覆盖 body，故落在 #root 上） -->
    <style>
      #root {
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #1a2742;
      }
    </style>
    <script>
      /* 在首帧前标记动效就绪，避免「先显示再隐藏」的闪烁；尊重系统减弱动效设置 */
      try {
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('y-motion-ready');
        }
        if (window.localStorage.getItem('yutu.motionOff') === '1') {
          document.documentElement.classList.add('y-motion-off');
        }
      } catch (e) {}
    </script>
    <noscript>
      <style>
        html.y-motion-ready #yutu2 .y-lead,
        html.y-motion-ready #yutu2 .y-zone,
        html.y-motion-ready #yutu2 .y-insight,
        html.y-motion-ready #yutu2 .y-card,
        html.y-motion-ready #yutu2 .y-loop-done {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>

    <script data-id="dev-inject-monitor">
      (function() {
        const remote = "/sdk/dev-monitor.js";
        const separator = remote.includes('?') ? '&' : '?';
        const script = document.createElement('script');
        script.src = remote + separator + 't=' + Date.now();
        script.dataset.id = 'dev-inject-monitor-script';
        script.defer = true;
        // 防止重复注入
        if (!document.querySelector('[data-id="dev-inject-monitor-script"]')) {
          document.head.appendChild(script);
        }
      })();
    </script>
  
</head>
